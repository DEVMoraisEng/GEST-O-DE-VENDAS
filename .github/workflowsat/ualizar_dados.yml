name: Atualizar dados e publicar painel de vendas

on:
  workflow_dispatch:        # botão manual / cron-job.org
  push:
    branches: [main]
  repository_dispatch:      # permite o CONTROLES-INTERNOS disparar este painel
    types: [dados-atualizados]
  schedule:
    # O schedule nativo do GitHub é pouco confiável em repos parados.
    # Roda 30 min depois do ciclo do CONTROLES-INTERNOS (que roda a cada 4h).
    - cron: '30 */4 * * *'

# Evita dois deploys simultâneos brigando pelo push
concurrency:
  group: painel-vendas
  cancel-in-progress: false

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pages: write
      id-token: write

    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Gerar data_vendas.json enxuto
        env:
          # URL do data.json completo publicado pelo CONTROLES-INTERNOS.
          # Se o endereço mudar, basta alterar aqui.
          SOURCE_DATA_URL: https://devmoraiseng.github.io/CONTROLES-INTERNOS/data.json
        run: python gerar_dados_vendas.py

      - name: Preparar pasta de publicação
        run: |
          mkdir -p dist
          cp index.html           dist/
          cp vendas.html          dist/
          cp casas-vendidas.html  dist/
          cp data_vendas.json     dist/
          cp logo.png             dist/ 2>/dev/null || true

      - name: Commit data_vendas.json
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data_vendas.json
          if git diff --staged --quiet; then
            echo "data_vendas.json sem alterações — nada a comitar"
          else
            git commit -m "chore: atualizar data_vendas.json [skip ci]"
            git pull --rebase origin main
            git push origin main
          fi

      - name: Setup Pages
        uses: actions/configure-pages@v4

      - name: Upload artefato
        uses: actions/upload-pages-artifact@v3
        with:
          path: "dist"

      - name: Deploy Pages
        uses: actions/deploy-pages@v4
